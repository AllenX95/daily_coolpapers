<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Daily Cool Papers{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark">D</span>
      <span>Daily Cool Papers</span>
    </a>
    <nav class="main-nav" aria-label="主导航">
      <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">论文</a>
      <a class="nav-link {% if request.endpoint == 'favorites' %}active{% endif %}" href="{{ url_for('favorites') }}">收藏</a>
      <a class="nav-link {% if request.endpoint == 'categories' %}active{% endif %}" href="{{ url_for('categories') }}">类目</a>
      <a class="nav-link {% if request.endpoint == 'prompts' %}active{% endif %}" href="{{ url_for('prompts') }}">Prompt</a>
      <a class="nav-link {% if request.endpoint == 'llm_profiles' %}active{% endif %}" href="{{ url_for('llm_profiles') }}">LLM</a>
      <a class="nav-link {% if request.endpoint == 'settings' %}active{% endif %}" href="{{ url_for('settings') }}">设置</a>
      <a class="nav-link {% if request.endpoint == 'logs' %}active{% endif %}" href="{{ url_for('logs') }}">日志</a>
    </nav>
  </header>
  <main class="page">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <section class="flash">
          {% for message in messages %}
            <div>{{ message }}</div>
          {% endfor %}
        </section>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
